<title>Limpieza Llenadora-Premix · LL/10</title>
<style>
  :root{
    --orange:#FD980D;
    --green:#00B354;
    --blue:#0078d4;
    --dark:#1c1c1c;
    --gray-bg:#f4f4f5;
    --gray-border:#e2e2e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--gray-bg); color:var(--dark);
  }
  header{
    background:linear-gradient(90deg,var(--orange),#ffb347);
    padding:20px 24px; color:white;
  }
  header h1{margin:0; font-size:20px;}
  header p{margin:4px 0 0; font-size:13px; opacity:.9;}
  .container{max-width:720px; margin:0 auto; padding:20px;}
  .card{
    background:white; border-radius:12px; padding:20px;
    box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px;
  }
  label{font-size:13px; font-weight:600; color:#555; display:block; margin-bottom:6px;}
  input[list]{
    width:100%; padding:12px 14px; font-size:16px; border-radius:8px;
    border:1.5px solid var(--gray-border); margin-bottom:14px; background:white;
  }
  input[list]:focus{outline:none; border-color:var(--orange);}
  
  /* Layout de botones en paralelo */
  .button-group{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .idle-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width:130px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.2s;
  }
  .btn:hover{opacity:.92;}
  .btn-primary{background:var(--green);}
  .btn-idle{background:var(--blue);}

  .result{
    margin-top:16px; border-radius:10px; padding:16px 18px; font-size:15px; line-height:1.5;
  }
  .result.ok{background:#e6f8ee; border:1.5px solid var(--green);}
  .result.warn{background:#fff4e0; border:1.5px solid var(--orange);}
  .result.danger{background:#fdeaea; border:1.5px solid #e14b4b;}
  .result.unknown{background:#eee; border:1.5px solid #bbb;}
  .result h3{margin:0 0 8px; font-size:15px;}
  .badge{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; margin-bottom:8px;
  }
  .badge.ok{background:var(--green); color:white;}
  .badge.warn{background:var(--orange); color:white;}
  .badge.danger{background:#e14b4b; color:white;}
  .badge.unknown{background:#999; color:white;}
  .notes{margin-top:10px; padding-top:10px; border-top:1px dashed #ccc; font-size:13.5px;}
  .notes li{margin-bottom:5px;}
  .disclaimer{
    font-size:12px; color:#7a5000; background:#fff8ea; border:1px solid #ffe0a3;
    border-radius:8px; padding:10px 12px; margin-top:6px;
  }
</style>
</head>

const energyCodes = new Set(['G001145', 'G001481', 'G001425']);

const index = {};
subgroups.forEach(sg=>{
  sg.boxes.forEach(box=>{
    box.codes.forEach(code=>{
      const isEnergy = sg.isEnergy || energyCodes.has(code);
      index[code] = {sg, boxId: box.id, isEnergy};
    });
  });
});

// -----------------------------------------------------------------
// ÍNDICE code -> {matrixName, matrixObj, productName} para MONSTER y
// PEPSI/ROCKSTAR (matrices literales LL/17 y LL/18). Tienen prioridad
// sobre la lógica genérica del LL/10 cuando ambos códigos (actual y
// siguiente) están cubiertos por estas matrices.
// -----------------------------------------------------------------
const matrixIndex = {};
function registerMatrix(matrixObj, matrixName, brandLabel){
  const syntheticSg = {id:'matrix_'+matrixName.toLowerCase(), category:brandLabel, label:'', isEnergy:true, notes:{}, groupNote:''};
  Object.entries(matrixObj.products).forEach(([productName, info])=>{
    info.codes.forEach(code=>{
      matrixIndex[code] = {matrixName, matrixObj, productName};
      // Además se registra en el índice genérico como "energética" (isEnergy:true),
      // para que si un par de códigos no está cubierto por ninguna matriz de marca
      // (ej. LL/10 normal -> Monster/Pepsi, o Monster <-> Pepsi sin columna de enlace),
      // se aplique la regla general del LL/10: "hacia/desde energética: CIP SOSA 5 pasos".
      if(!(code in index)) index[code] = {sg: syntheticSg, boxId: -1, isEnergy: true};
    });
  });
}
registerMatrix(MONSTER, 'MONSTER', 'Monster');
registerMatrix(PEPSI, 'PEPSI', 'Pepsi/Rockstar');

// Columnas de "salida hacia fuera de la marca" en cada matriz
const MATRIX_FALLBACK_OUT = {
  MONSTER: {otherEnergy: 'Energética No Monster', refresco: 'Refresco'},
  PEPSI:   {otherEnergy: 'Energética\nNo PEPSI',   refresco: 'Refresco'}
};

// -----------------------------------------------------------------
// TABLA OFICIAL DE PERFIL DE JARABES (Ed. 8): código -> ENERGETICA | REFRESCO
// Esta tabla es la fuente autorizada de "es energética" y tiene prioridad
// sobre cualquier suposición hecha a partir de los grupos del LL/10.
// Regla: mismo perfil -> lavado (lógica normal); perfil distinto
// (energética <-> refresco) -> CIP (rama "esPaseAEnergetico"/"esSalidaDeEnergetico").
// OJO: el nombre del jarabe NO es fiable para deducir el perfil (hay jarabes
// con "ENERGÉTICA" en el nombre catalogados oficialmente como REFRESCO).
// -----------------------------------------------------------------
Object.entries(PERFILES).forEach(([code, info])=>{
  const isEnergyOficial = info.profile === 'ENERGETICA';
  if(index[code]){
    // Código ya conocido (LL/10 o matriz): se corrige/confirma su isEnergy
    // con el dato oficial, sin tocar el resto de su lógica (recuadros, notas...).
    index[code] = {...index[code], isEnergy: isEnergyOficial, perfilOficial: info.profile};
  } else {
    // Código no visto en ningún otro documento: se registra solo con el perfil.
    const syntheticSg = {
      id: 'perfil_'+code, category: info.profile === 'ENERGETICA' ? 'Energética (tabla de perfiles)' : 'Refresco (tabla de perfiles)',
      label: info.desc, isEnergy: isEnergyOficial, notes:{}, groupNote:''
    };
    index[code] = {sg: syntheticSg, boxId: -1, isEnergy: isEnergyOficial, perfilOficial: info.profile};
  }
});

const datalist = document.getElementById('codes');
Object.keys(index).sort().forEach(code=>{
  const opt = document.createElement('option');
  opt.value = code;
  datalist.appendChild(opt);

function findLinkPath(sg, fromBox, toBox){
  if(fromBox === toBox) return 'same';
  if(!sg.links) return null;

  let visitedForward = new Set([fromBox]);
  let queue = [fromBox];
  while(queue.length){
    let next = [];
    for(let b of queue){
      for(let l of sg.links){
        if(l[0] === b && !visitedForward.has(l[1])){
          if(l[1] === toBox) return 'forward';
          visitedForward.add(l[1]);
          next.push(l[1]);
        }
      }
    }
    queue = next;
  }

  let visitedReverse = new Set([fromBox]);
  queue = [fromBox];
  while(queue.length){
    let next = [];
    for(let b of queue){
      for(let l of sg.links){
        if(l[1] === b && !visitedReverse.has(l[0])){
          if(l[0] === toBox) return 'reverse';
          visitedReverse.add(l[0]);
          next.push(l[0]);
        }
      }
    }
    queue = next;
  }

  return null;
}

function renderResult(cssClass, badgeText, title, bodyHtml, notesArr){
  const el = document.getElementById('resultado');
  let notesHtml = '';
  if(notesArr && notesArr.length){
    notesHtml = '<div class="notes"><strong>Notas / excepciones aplicables:</strong><ul>' +
      notesArr.map(n=>'<li>'+n+'</li>').join('') + '</ul></div>';
  }
  el.innerHTML = `<div class="result ${cssClass}">
      <span class="badge ${cssClass}">${badgeText}</span>
      <h3>${title}</h3>
      <div>${bodyHtml}</div>
      ${notesHtml}
    </div>`;
}

// Traduce el tipo normalizado de una celda de matriz Monster/Pepsi a la
// visualización de la app (color, badge, texto)
function renderMatrixResult(origen, destino, brandLabel, cell){
  const detail = cell.detail;
  let cssClass, badge, title, body;
  switch(cell.type){
    case 'same':
      cssClass='ok'; badge='Mismo producto';
      title='Sigues en el mismo producto';
      body=`<b>${origen} → ${destino}</b> son el mismo producto (${brandLabel}). No es un cambio real, pero el documento indica una limpieza periódica: <b>${detail}</b> (mantenimiento del sistema mientras se mantiene el mismo producto).`;
      break;
    case 'cold':
      cssClass='ok'; badge='Agua fría';
      title='Lavado con agua fría (Limpieza Máquinas)';
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): según la matriz oficial, hacer <b>lavado con agua fría</b> (limpieza Máquinas, automático).`;
      break;
    case 'hot':
      cssClass='warn'; badge='Agua caliente';
      title='Lavado con agua caliente';
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): según la matriz oficial, hacer <b>lavado con agua caliente</b>.`;
      break;
    case 'cip3':
      cssClass='warn'; badge='CIP 3 pasos';
      title='CIP SOSA 3 pasos';
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): según la matriz oficial, hacer <b>CIP SOSA 3 pasos</b>.${/cada 72/i.test(detail)?' (Nota: cada 72h de producción continua con el mismo producto, hacer también CIP SOSA 3 pasos de mantenimiento).':''}`;
      break;
    case 'cip5':
      cssClass='danger'; badge='CIP 5 pasos';
      title='CIP SOSA 5 pasos';
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): según la matriz oficial, hacer <b>CIP SOSA 5 pasos</b>.`;
      break;
    case 'cip5_85':
      cssClass='danger'; badge='CIP 5 pasos 85ºC';
      title='CIP SOSA 5 pasos a 85ºC';
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): según la matriz oficial, hacer <b>CIP SOSA 5 pasos con sosa a 85ºC</b>.`;
      break;
    case 'cip5_out':
      cssClass='danger'; badge='CIP 5 pasos · salida energética';
      title='CIP SOSA 5 pasos (salida de energética)';
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): sales de un producto energético hacia un refresco/otro producto. Hacer <b>CIP SOSA 5 pasos (salida energético)</b>.`;
      break;
    default:
      cssClass='unknown'; badge='Ver documento';
      title=detail;
      body=`<b>${origen} → ${destino}</b> (${brandLabel}): valor de la matriz: <b>${detail}</b>.`;
  }
  renderResult(cssClass, badge, title, body, [`Fuente: matriz oficial ${brandLabel} (no la lógica genérica del LL/10).`]);
}

function consultar(){
  const origen = document.getElementById('origen').value.trim().toUpperCase();
  const destino = document.getElementById('destino').value.trim().toUpperCase();

  if(!origen || !destino){
    renderResult('unknown','Atención','Faltan datos','Introduce el código del jarabe actual y del siguiente.');
    return;
  }

  // -----------------------------------------------------------------------
  // PASO 0: matrices Monster / Pepsi-Rockstar (prioridad sobre el LL/10)
  // -----------------------------------------------------------------------
  const mOrigin = matrixIndex[origen];
  const mDest = matrixIndex[destino];

  if(mOrigin){
    const brandLabel = mOrigin.matrixName === 'MONSTER' ? 'Monster' : 'Pepsi/Rockstar';

    // Caso 1: ambos códigos en la MISMA matriz -> lookup directo
    if(mDest && mDest.matrixName === mOrigin.matrixName){
      const cell = mOrigin.matrixObj.matrix[mOrigin.productName]?.[mDest.productName];
      if(cell){ renderMatrixResult(origen, destino, brandLabel, cell); return; }
    }

    // Caso 2: destino fuera de esta matriz (otra marca energética, o no energética)
    if(!mDest || mDest.matrixName !== mOrigin.matrixName){
      const fb = MATRIX_FALLBACK_OUT[mOrigin.matrixName];
      const dIsEnergyGeneric = !!mDest || !!(index[destino] && index[destino].isEnergy);
      const fallbackCol = dIsEnergyGeneric ? fb.otherEnergy : fb.refresco;
      const cell = mOrigin.matrixObj.matrix[mOrigin.productName]?.[fallbackCol];
      if(cell){ renderMatrixResult(origen, destino, brandLabel, cell); return; }
    }
  }

  const oInfo = index[origen];
  const dInfo = index[destino];

  if(!oInfo || !dInfo){
    const faltantes = [!oInfo?origen:null, !dInfo?destino:null].filter(Boolean).join(', ');
    renderResult('unknown','Código no encontrado','No se puede determinar la limpieza',
      `El código <b>${faltantes}</b> no está en la base de datos de esta herramienta (ni en LL/10, ni en Monster, ni en Pepsi/Rockstar). Consultar el documento original o avisar para añadirlo.`);
    return;
  }

  const notes = [];
  if(oInfo.sg.notes && oInfo.sg.notes[origen]) notes.push(`<b>${origen}</b> (actual): ${oInfo.sg.notes[origen]}`);
  if(dInfo.sg.notes && dInfo.sg.notes[destino]) notes.push(`<b>${destino}</b> (siguiente): ${dInfo.sg.notes[destino]}`);
  if(oInfo.sg.groupNote) notes.push(`Grupo "${oInfo.sg.category} ${oInfo.sg.label}": ${oInfo.sg.groupNote}`);
  if(dInfo.sg.id !== oInfo.sg.id && dInfo.sg.groupNote) notes.push(`Grupo "${dInfo.sg.category} ${dInfo.sg.label}": ${dInfo.sg.groupNote}`);

  // -----------------------------------------------------------------------------------
  // CONTROL DE CALIDAD - LÍNEA 9 (Ed. 219): Muestra de agua tras Limón / Naranja / Piña
  // -----------------------------------------------------------------------------------
  const origenEsZumo = !!oInfo.sg.isJuice;

  if (origenEsZumo) {
    notes.push('🧪 <b>Control de Laboratorio (Línea 9):</b> Al pasar de Limón, Naranja o Piña a cualquier otro producto, realizar lavado con agua fría y <b>coger 1 litro de muestra de agua de grifo o de Antón</b> para filtrar en laboratorio y comprobar que no queden restos de color, sabor o pulpa.');
  }

  const tipoAzucar = dInfo.sg.isLight ? 'acidez' : 'brix';

  // 1. REGLA: Mismo Subgrupo y Evaluación Direccional por Flechas
  if(oInfo.sg.id === dInfo.sg.id){
    const rel = findLinkPath(oInfo.sg, oInfo.boxId, dInfo.boxId);
    
    // Mismo recuadro o avance en la dirección de las flechas -> ESCURRIDO
    if(rel === 'same' || rel === 'forward'){
      renderResult('ok', 'Escurrido', `Cambio escurrido ${tipoAzucar}`,
        `<b>${origen} → ${destino}</b>: Transición en el mismo recuadro o siguiendo la dirección de las flechas ($\rightarrow$). Requiere únicamente <b>escurrido bien</b> del premix y la llenadora. Nunca empujar un producto con otro.`, notes);
      return;
    }
    
    // Sentido contrario a las flechas -> LAVADO
    if(rel === 'reverse'){
      renderResult('warn', `Lavado ${tipoAzucar}`, `Cambio lavado ${tipoAzucar}`,
        `<b>${origen} → ${destino}</b>: Transición en <b>sentido contrario a las flechas ($\leftarrow$)</b>. Al ir en sentido inverso, no aplica escurrido y se debe realizar <b>Cambio lavado ${tipoAzucar}</b>.`, notes);
      return;
    }
  }

  // 2. REGLA CIP ENERGÉTICO O PASO A ENERGÉTICO / POSTOBÓN / LIMA-LIMÓN
  const esPaseAEnergetico = !oInfo.isEnergy && dInfo.isEnergy;
  const esSalidaDeEnergetico = oInfo.isEnergy && !dInfo.isEnergy;
  const esLimaLimon = dInfo.sg.category === 'Lima-Limón';
  const esPostobon = (oInfo.sg.id === 'postobon' || dInfo.sg.id === 'postobon') && (oInfo.sg.id !== dInfo.sg.id);

  if(esPaseAEnergetico || esSalidaDeEnergetico){
    renderResult('danger', 'CIP Energética/Vino', `Cambio CIP Energética/Vino (${tipoAzucar})`,
      `<b>${origen} → ${destino}</b>: Transición relacionada con producto de perfil energético. Se debe hacer **CIP SOSA 5 pasos (CIP Energética/Vino)**.`, notes);
    return;
  }

  if(esLimaLimon || esPostobon){
    renderResult('danger', 'CIP Estándar/Refresco', `Cambio CIP estandar/refresco (${tipoAzucar})`,
      `<b>${origen} → ${destino}</b>: Requiere realización de **CIP 5 pasos con sosa (CIP Estándar/Refresco)**.`, notes);
    return;
  }

  // 3. REGLAS GENERALES DE LAVADOS
  renderResult('warn', `Lavado ${tipoAzucar}`, `Cambio lavado ${tipoAzucar}`,
    `<b>${origen} → ${destino}</b>: Realizar **Cambio lavado ${tipoAzucar}** (Limpieza Máquinas en automático con agua). Revisa las observaciones por si requiere agua caliente o filtros específicos.`, notes);
}
